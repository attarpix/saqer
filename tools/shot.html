<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>shot</title>
<style>html,body{margin:0;background:#000;overflow:hidden}iframe{border:0;width:1280px;height:960px;display:block}pre{color:#0f0;font:14px monospace;margin:4px;white-space:pre-wrap}</style></head>
<body>
<!-- Test helper: loads the game, runs the script in ?js=… against it (S = __saqer, held), for screenshots. -->
<iframe id="g" src="../index.html?debug"></iframe><pre id="out"></pre>
<script>
const q = new URLSearchParams(location.search);
const f = document.getElementById('g');
(async () => {
  let S;
  for (;;) { S = f.contentWindow && f.contentWindow.__saqer; if (S && S.G.state === 'title') break; await new Promise(r => setTimeout(r, 50)); }
  S.hold = true;
  const press = (k, n) => { S.keys[k] = true; S.step(n); S.keys[k] = false; };
  let res = '';
  try { res = new Function('S', 'press', 'W', q.get('js') || '')(S, press, f.contentWindow); } catch (e) { res = 'ERROR ' + e.stack; }
  S.render();
  if (res !== undefined && res !== '') document.getElementById('out').textContent = typeof res === 'string' ? res : JSON.stringify(res);
  document.title = 'ready';
})();
</script>
</body></html>
